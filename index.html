<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Carnet de gares : un jeu pour découvrir les trains de France, de 1950 à aujourd'hui.">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Carnet de gares</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Archivo:wght@800&family=Barlow+Condensed:wght@700&family=Cinzel:wght@700&family=DM+Sans:wght@700&family=Figtree:wght@800&family=IBM+Plex+Sans:wght@700&family=Inter+Tight:wght@800&family=Kaushan+Script&family=Lato:wght@400;700&family=Manrope:wght@800&family=Montserrat:wght@800&family=Nunito:wght@800&family=Oswald:wght@600&family=Outfit:wght@700&family=Public+Sans:wght@800&family=Rubik:wght@700&display=swap">
<style>
/* Layout: a paper album shell (accueil, époques, réglages du voyage) around pages that re-skin to each train's own era look. Single look by choice: every colour is set explicitly. */
:root{--paper:#EFE9DA;--card:#FBF6E6;--ink:#2A2420;--muted:#5A4E40;--red:#C8282D;--line:#D8CFB8;--display:'Abril Fatface',Georgia,serif;--body:'Lato',system-ui,sans-serif}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px;padding-block:14px;border-bottom:3px double var(--ink)}
.brand{font-family:var(--display);font-size:26px;color:var(--red);text-decoration:none;background:none;border:0;padding:0}
.nav{display:flex;flex-wrap:wrap;gap:4px}
.nav button{background:none;border:0;padding:10px 14px;min-height:44px;font-weight:700;letter-spacing:.08em;font-size:13px;text-transform:uppercase;border-radius:999px}
.nav button[aria-current="page"]{background:var(--ink);color:var(--paper)}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:400}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.hero{display:grid;grid-template-columns:minmax(0,1fr);align-items:center;justify-items:center;padding-block:36px 24px}
.hero>*{grid-area:1/1}
.cta{position:relative;z-index:1;display:flex;justify-content:center}
.hero h1{font-family:var(--display);font-size:clamp(48px,9vw,96px);line-height:.95;color:var(--red);margin-bottom:28px}
.hero p{max-width:46ch;font-size:19px}
.collage{position:relative;width:100%;height:clamp(500px,74vh,760px)}
.collage figure{position:absolute;margin:0;padding:8px 8px 40px;background:var(--card);box-shadow:4px 6px 0 -1px rgba(42,36,32,.3)}
.collage figure::after{content:"";position:absolute;top:16px;right:16px;width:30px;height:38px;border:3px double var(--red);background:rgba(251,246,230,.6)}
.collage img{display:block;width:100%;height:100%;object-fit:cover;background:#ccc}
.portals{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;padding-block:20px}
.portal{display:flex;flex-direction:column;gap:12px;text-align:left;border:0;padding:22px;min-height:230px;background:var(--card);box-shadow:5px 6px 0 -1px rgba(42,36,32,.22)}
.portal h2{font-family:var(--display);font-size:32px;line-height:1}
.portal p{margin:0;color:var(--muted)}
.chips{display:flex;gap:6px;margin-top:auto}
.chips i{flex:1;height:30px}
.thumbs{display:flex;gap:6px;margin-top:auto}
.thumbs img{width:25%;aspect-ratio:1;object-fit:cover;display:block}
.bigspeed{margin-top:auto;font-family:var(--display);font-size:54px;line-height:1;color:var(--red)}
.progress{display:flex;flex-wrap:wrap;gap:12px 32px;align-items:center;padding:16px 20px;background:var(--card);border-radius:14px;margin-top:8px}
.progress b{font-family:var(--display);font-size:28px;font-weight:400}
.small{font-size:13px;color:var(--muted)}
.link{background:none;border:0;padding:8px 0;text-decoration:underline;color:var(--muted);font-size:13px}
.era{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;padding-block:22px;border-bottom:1px solid var(--line)}
.era h2{font-family:var(--display);font-size:30px;line-height:1}
.era .yrs{font-weight:700;letter-spacing:.12em;font-size:13px;color:var(--red)}
.row{display:flex;flex-wrap:wrap;gap:14px}
.mini{width:176px;border:0;padding:0;text-align:left;overflow:hidden;background:var(--t-bg);color:var(--t-ink);font-family:var(--t-font);border-radius:var(--t-r);box-shadow:var(--t-sh)}
.mini img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.mini span{display:block;padding:10px 12px 12px;font-size:18px;line-height:1.1}
.mini small{display:block;font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.06em;margin-top:4px}
.mini.lock img{filter:grayscale(1) contrast(.8);opacity:.5}
/* Pages themed per train */
.th{background:var(--t-bg);color:var(--t-ink);font-family:var(--t-font);border-radius:0 0 var(--t-r) var(--t-r);padding:28px clamp(16px,3vw,40px) 36px}
.th .btn,.popc .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 26px;border:0;border-radius:var(--t-btn);background:var(--t-acc);color:var(--t-on);font-family:var(--t-font);font-size:20px;text-decoration:none;box-shadow:var(--t-sh)}
.th .btn.alt{background:var(--t-panel);color:var(--t-pi)}
.popc .btn{background:var(--t-pi);color:var(--t-panel)}
.popc .btn.alt{background:none;color:var(--t-pi);box-shadow:inset 0 0 0 2px var(--t-pi)}
.th .btn[disabled]{opacity:.5;cursor:not-allowed}
.tp{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:36px;align-items:start}
.frame{margin:0;border:10px solid var(--t-panel);border-radius:var(--t-r);overflow:hidden;box-shadow:var(--t-sh);background:#ccc;line-height:0}
.frame img{width:100%;aspect-ratio:4/3;object-fit:cover}
.cred{font-size:13px;margin-top:12px;font-family:var(--body);line-height:1.4}
.th h1{font-size:clamp(44px,7vw,84px);line-height:.95}
.sub{font-size:20px;margin:12px 0 4px;font-family:var(--body);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0}
.stat{display:grid;grid-template-columns:48px minmax(0,1fr);column-gap:12px;align-items:center;background:var(--t-panel);color:var(--t-pi);padding:12px 14px;border-radius:var(--t-r);box-shadow:var(--t-sh)}
.stat .ic{grid-row:1/3;width:48px;height:48px;padding:11px;border-radius:50%;background:var(--t-acc);stroke:var(--t-on);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stat b{display:block;font-size:28px;line-height:1.05;font-weight:400;overflow-wrap:anywhere}
.stat span{font-family:var(--body);font-size:14px;font-weight:700;line-height:1.25}
.blurb{font-family:var(--body);font-size:18px;max-width:52ch}
.acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.era-tag{font-family:var(--body);font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin-bottom:12px}
.pn{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:28px}
/* Voyage */
.setup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.mapcard{background:var(--t-panel);border-radius:var(--t-r);padding:12px;box-shadow:var(--t-sh)}
.mapcard svg{display:block;width:100%;height:auto;max-height:70vh}
.picker{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px}
.pick{flex:0 0 92px;border:3px solid transparent;background:var(--t-panel);color:var(--t-pi);border-radius:var(--t-r);padding:0;overflow:hidden;text-align:center;font-family:var(--body);font-size:12px;font-weight:700}
.pick img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.pick[aria-pressed="true"]{border-color:var(--t-acc);outline:3px solid var(--t-ink)}
.pick span{display:block;padding:4px 2px 6px;line-height:1.1}
.pick.lock img{filter:grayscale(1);opacity:.45}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0}
.tile{width:clamp(48px,10vw,76px);aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;border:0;border-radius:var(--t-btn);background:var(--t-panel);color:var(--t-pi);font-family:var(--t-font);font-size:clamp(28px,6vw,46px);box-shadow:var(--t-sh)}
.tile.done{background:var(--t-acc);color:var(--t-on)}
.tile.next{outline:4px solid var(--t-ink);outline-offset:3px}
.tile.bad{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#typer,#sg-in{width:100%;min-height:56px;font:inherit;font-size:22px;text-align:center;border:3px solid var(--t-ink);background:var(--t-panel);color:var(--t-pi);border-radius:var(--t-btn);padding:0 16px;font-family:var(--t-font)}
#typer{text-transform:uppercase}
.banner{min-height:28px;text-align:center;font-family:var(--body);font-weight:700;font-size:18px}
.end{background:var(--t-panel);color:var(--t-pi);border-radius:var(--t-r);padding:22px;margin-top:18px;box-shadow:var(--t-sh);text-align:center}
.end h2{font-size:40px;line-height:1}
.end img{width:min(100%,360px);display:block;margin:14px auto;border-radius:var(--t-r)}
/* Devine la vitesse */
.big{font-size:clamp(64px,12vw,110px);line-height:1;text-align:center}
.big small{font-size:.3em;font-family:var(--body);font-weight:700}
.rng{width:100%;accent-color:var(--t-acc);height:36px}
.stepper{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 14px}
.stepper .btn{min-height:48px;padding:0 18px;font-size:18px}
.hint{font-family:var(--t-font);font-size:clamp(34px,6vw,54px);line-height:1;text-align:center;min-height:56px;margin:8px 0}
.hist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px;font-family:var(--body);font-weight:700}
.hist li{background:var(--t-panel);color:var(--t-pi);padding:6px 12px;border-radius:var(--t-btn)}
.hero .lead{font-size:clamp(22px,3.4vw,30px);font-weight:700;line-height:1.25;max-width:20ch;margin:0 0 24px}
.go{display:inline-flex;align-items:center;gap:10px;min-height:72px;padding:0 44px;border:6px solid var(--card);border-radius:999px;background:var(--red);color:#fff;font-family:var(--display);font-size:36px;box-shadow:0 6px 0 #8f1c20}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #8f1c20}
.collage figcaption{position:absolute;left:0;right:0;bottom:0;height:40px;display:flex;align-items:center;padding:0 12px;font-family:'Kaushan Script',cursive;font-size:20px;color:var(--ink)}
.album{background:var(--card);border-radius:24px;padding:20px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:5px 6px 0 -1px rgba(42,36,32,.22);margin-top:8px}
.albumhead{display:flex;flex-wrap:wrap;align-items:center;gap:16px 44px}
.count{font-family:var(--display);font-size:56px;line-height:1;color:var(--red)}
.count b{font-weight:400}
.stars{display:flex;gap:6px}
.star{font-size:44px;line-height:1;color:var(--line)}
.star.on{color:#E3A800}
.lp{width:96px;height:64px;object-fit:cover;border-radius:12px;filter:grayscale(1);opacity:.4;margin-left:auto}
.lp.on{filter:none;opacity:1}
.stks{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:10px}
.stk{border:0;padding:0;border-radius:50%;aspect-ratio:1;overflow:hidden;background:var(--line);filter:grayscale(1);opacity:.35}
.stk img{display:block;width:100%;height:100%;object-fit:cover}
.stk.on{filter:none;opacity:1;box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--red)}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:8px}
.game{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;border:0;padding:20px 16px;background:var(--t-acc);color:var(--t-on);border-radius:var(--t-r);box-shadow:var(--t-sh);font-family:var(--t-font)}
.game .ic{width:64px;height:64px;padding:14px;border-radius:50%;background:var(--t-on);stroke:var(--t-acc);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.game b{font-size:26px;line-height:1;font-weight:400}
.game span{font-family:var(--body);font-size:14px;font-weight:700;line-height:1.25}
.game.alt{background:var(--t-panel);color:var(--t-pi)}
.game.alt .ic{background:var(--t-acc);stroke:var(--t-on)}
.game[disabled]{opacity:.5;cursor:not-allowed}
.phw{position:relative}
.info{position:absolute;right:16px;bottom:16px;width:20px;height:20px;padding:0;border:0;border-radius:50%;background:var(--t-panel);color:var(--t-pi);font:italic 700 12px/20px Georgia,serif;opacity:.85}
.info::after{content:"";position:absolute;inset:-12px}
.credpop{position:absolute;left:16px;right:44px;bottom:16px;background:var(--t-panel);color:var(--t-pi);padding:3px 8px;font:11px/1.3 var(--body);border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stks2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.stk2{border:0;padding:0;background:var(--paper);border-radius:14px;overflow:hidden;text-align:center;font-family:var(--display);font-size:17px;line-height:1.1;color:var(--ink);opacity:.55}
.stk2 img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;filter:grayscale(1)}
.stk2 span{display:block;padding:8px 6px 10px}
.stk2.on{opacity:1;box-shadow:0 0 0 3px var(--red)}
.stk2.on img{filter:none}
.track{position:relative;height:170px;overflow:hidden;margin-top:8px}
.rails{position:absolute;left:0;right:0;bottom:14px;height:14px;background:repeating-linear-gradient(90deg,#8b7b63 0 8px,transparent 8px 28px) bottom/100% 8px no-repeat}
.rails::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--ink)}
.rider{position:absolute;bottom:22px;left:-660px;width:min(640px,86vw);animation:ride 14s linear infinite,bob .35s ease-in-out infinite alternate}
.rider svg{display:block;width:100%;height:auto}
@keyframes ride{from{left:-660px}to{left:100%}}
@keyframes bob{from{margin-bottom:0}to{margin-bottom:1px}}
#pop{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,20,24,.6)}
.popc{font-family:var(--t-font);background:var(--t-panel);color:var(--t-pi);border-radius:var(--t-r);box-shadow:var(--t-sh);padding:22px;max-width:420px;width:100%;max-height:100%;overflow:auto;text-align:center;animation:popin .35s ease-out}
.popc img{width:100%;display:block;margin:12px 0;border-radius:var(--t-r)}
.popc h2{font-size:34px;line-height:1;margin-bottom:14px}
@keyframes popin{from{transform:scale(.85);opacity:0}}
@media (prefers-reduced-motion:reduce){.popc{animation:none}}
@media (prefers-reduced-motion:reduce){.rider{animation:none;left:38%}}
.stk2{position:relative}
.stk2.off{opacity:.65}
.stk2.off img{filter:grayscale(1) blur(1.5px)}
.stk2.on{opacity:1;box-shadow:0 0 0 3px var(--red)}
.lk{position:absolute;top:10px;left:10px;width:32px;height:32px;padding:7px;border-radius:50%;background:var(--ink);stroke:var(--paper);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rbtn{min-height:52px;padding:0 26px;border:0;border-radius:999px;background:var(--red);color:#fff;font:700 18px var(--body);align-self:flex-start}
.rbtn.alt{background:transparent;color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.rst p{margin:0 0 4px;font-weight:700;font-size:18px}
.vid{margin-top:16px}
.vid video{display:block;width:100%;aspect-ratio:16/9;border-radius:var(--t-r);background:#000;object-fit:cover}
.vid .info{top:10px;bottom:auto}
.vid .credpop{top:10px;bottom:auto}
.memo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mc{position:relative;aspect-ratio:4/3;padding:0;border:0;overflow:hidden;border-radius:var(--t-r);background:var(--t-acc);color:var(--t-on);font:clamp(28px,6vw,48px) var(--t-font);box-shadow:var(--t-sh)}
.mc img{display:block;width:100%;height:100%;object-fit:cover}
.mc span{position:absolute;left:0;right:0;bottom:0;padding:3px 8px;background:var(--t-panel);color:var(--t-pi);font:700 12px var(--body);text-align:left}
.mc span:empty{display:none}
.mc.ok{opacity:.6}
.opts{display:flex;flex-direction:column;gap:12px;margin:18px 0}
.opt{min-height:60px;padding:0 20px;border:0;border-radius:var(--t-btn);background:var(--t-panel);color:var(--t-pi);font:clamp(22px,3.4vw,30px) var(--t-font);box-shadow:var(--t-sh)}
.opt.good{background:#1F7A4A;color:#fff}
.opt.bad{opacity:.5;text-decoration:line-through}
[data-sw]:focus-visible circle{stroke:#000;stroke-width:5}
#dbg{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20}
.dbg{display:flex;align-items:center;gap:10px;background:#111;color:#fff;padding:8px 8px 8px 14px;border-radius:999px;font:700 13px/1 var(--body);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.dbg button{border:0;border-radius:999px;background:#fff;color:#111;padding:8px 14px;font:700 13px var(--body);min-height:36px}
.back{display:inline-flex;align-items:center;min-height:44px;margin-bottom:6px;font:700 14px var(--body);letter-spacing:.04em;color:var(--t-ink);text-decoration:none}
.back:hover{text-decoration:underline}
.yts{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.ytx{display:block;margin-top:8px;padding:6px 12px;border:0;border-radius:var(--t-btn);background:var(--t-panel);color:var(--t-pi);font:700 13px var(--body);box-shadow:var(--t-sh)}
.ytb{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 14px;border:0;border-radius:var(--t-btn);background:var(--t-panel);color:var(--t-pi);text-align:left;font:700 15px/1.25 var(--body);box-shadow:var(--t-sh)}
.ytp{flex:none;width:34px;height:34px;border-radius:50%;background:var(--t-acc);color:var(--t-on);display:flex;align-items:center;justify-content:center;font-size:13px}
.yt iframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:var(--t-r);background:#000}
@media (max-width:760px){.memo{grid-template-columns:repeat(3,minmax(0,1fr))}.hero,.tp,.setup,.era{grid-template-columns:minmax(0,1fr)}.collage{height:400px}.mini{width:calc(50% - 7px)}}
@media (prefers-reduced-motion:reduce){.tile.bad{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar"><button class="brand" data-go="home">Carnet de gares</button><nav class="nav" id="nav" aria-label="Explorer"></nav></header>
  <main id="app"></main>
  <div id="dbg"></div>

function route(a,b){
  const w=(x,y,k)=>Math.hypot(CITY[x][0]-CITY[y][0],CITY[x][1]-CITY[y][1])*(k==='L'?0.6:1.4);
  const dist={[a]:0},prev={},todo=new Set(Object.keys(CITY));
  while(todo.size){let u=null;todo.forEach(n=>{if(dist[n]!==undefined&&(u===null||dist[n]<dist[u]))u=n});if(u===null||u===b)break;todo.delete(u);

}

  const lines=legs.map(l=>`<path d="${pathD(l)}" fill="none" stroke="${acc}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`).join('');

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const sgVal=(g,t)=>g.kind==='cap'?t.cap:t.speed;
const sgSlack=(g,t)=>g.kind==='cap'?Math.max(5,Math.round(t.cap*.1)):SLACK;
function startSpeed(only,kind='speed'){

function speed(){

  const t=byId(g.order[g.r]),tr=g.tries,last=tr[tr.length-1],over=g.phase!=='ask';

  const hint=last&&!over?(last.v<val?'Plus haut ↑':'Plus bas ↓'):'';
  const closing=g.phase==='win'?(cap?`Bravo ! Il a ${val} places. Tu étais à ${Math.abs(last.v-val)} places près.`:`Bravo ! Il roule à ${val} km/h. Tu étais à ${Math.abs(last.v-val)} km/h près.`):(cap?`Il a ${val} places.`:`C'était ${val} km/h.`);
  const lastOne=g.r===g.order.length-1;
  return `<article class="th" style="${th(t.t)}">${back(t)}<div class="era-tag">${g.solo?'Une seule question':`Train ${g.r+1} sur ${g.order.length}`} · Essai ${Math.min(tr.length+(over?0:1),MAXTRIES)} sur ${MAXTRIES} · Score ${g.score}</div><div class="tp"><div class="phw"><figure class="frame"><img src="${photo(t)}" alt="${t.name}" style="object-position:${t.pos}"></figure>${credBtn(t)}</div>
  <div><h1 style="font-size:clamp(36px,5vw,64px)">${t.name}</h1><div class="sub">${cap?'Combien de places a-t-il ?':'À quelle vitesse maximale roule-t-il ?'}</div>

  <div class="stepper">${(cap?[-100,-10,10,100]:[-10,-1,1,10]).map(n=>`<button class="btn alt" data-step="${n}" ${over?'disabled':''}>${n>0?'+'+n:'−'+Math.abs(n)}</button>`).join('')}</div>
  <input id="sg-in" type="number" inputmode="numeric" min="0" max="${cap?2000:400}" value="${g.gv}" aria-label="Ta réponse" ${over?'disabled':''}>

  <ul class="hist" aria-label="Tes essais">${tr.map(x=>`<li>${x.v} ${unit} ${Math.abs(x.v-val)<=sl?'✓':x.v<val?'↑':'↓'}</li>`).join('')}</ul>
  <p class="cred">${cap?`Nombre de places de la fiche. Tu gagnes à ${sl} places près.`:`Vitesse maximale en service. Tu gagnes à ${SLACK} km/h près.`}</p></div></div></article>`;
}
function setGv(v){
  const g=S.sg,cap=g.kind==='cap';v=Math.max(0,Math.min(cap?2000:400,Math.round(v)));g.gv=v;
  const r=$('#sg-range'),n=$('#sg-in'),b=$('#sg-big');

function guess(){
  const g=S.sg,t=byId(g.order[g.r]),v=Number($('#sg-in').value);

function nextSpeed(){

/* ---- Voix : survole une lettre ou une heure pour l'entendre ---- */
const LETTRE={A:'a',B:'bé',C:'cé',D:'dé',E:'eu',F:'effe',G:'gé',H:'hache',I:'i',J:'ji',K:'ka',L:'elle',M:'emme',N:'enne',O:'o',P:'pé',Q:'ku',R:'erre',S:'esse',T:'té',U:'u',V:'vé',W:'double vé',X:'ixe',Y:'i grec',Z:'zède'};

let said=null;
function say(txt){
  try{const u=new SpeechSynthesisUtterance(txt);u.lang='fr-FR';const v=speechSynthesis.getVoices().find(x=>/^fr/i.test(x.lang));if(v)u.voice=v;u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}

/* ---- Voyage : taper le nom du train ---- */
let anim=0;
function initPlay(){
  const P=S.play,live=$('#live'),t=P.t;
  live.innerHTML=`<path id="guide" fill="none" stroke="${t.t.ink}" stroke-opacity=".35" stroke-width="5" stroke-dasharray="4 10"/><path id="trail" fill="none" stroke="${line(t)}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <g id="tok"><clipPath id="cl"><circle r="30"/></clipPath><circle r="35" fill="#fff"/><image href="${photo(t)}" x="-42" y="-30" width="84" height="60" preserveAspectRatio="xMidYMid slice" clip-path="url(#cl)"/><circle r="35" fill="none" stroke="${line(t)}" stroke-width="5"/></g>`;
  P.guide=$('#guide');P.trail=$('#trail');P.tok=$('#tok');

function startLeg(){

  setFrac(0);

  $('#msg').textContent=names.length>2?`On passe par ${names.slice(1,-1).join(' et ')}, là où les lignes rapides se rejoignent.`:'';

}
function setFrac(f){const P=S.play;P.frac=f;const p=P.trail.getPointAtLength(P.len*f);P.tok.setAttribute('transform',`translate(${p.x},${p.y})`);P.trail.style.strokeDashoffset=P.len*(1-f)}
function tiles(bad){
  const P=S.play,w=P.t.word;
  $('#tiles').innerHTML=[...w].map((ch,i)=>`<button class="tile ${i<P.idx?'done':''} ${i===P.idx?'next':''} ${bad&&i===P.idx?'bad':''}" data-ch="${ch}" data-say="${LETTRE[ch]||ch}" aria-label="${ch}">${ch}</button>`).join('');
}
function tween(to,done){
  const P=S.play,from=P.frac,ms=matchMedia('(prefers-reduced-motion: reduce)').matches?0:420,t0=performance.now(),id=++anim;
  (function step(now){if(id!==anim||P!==S.play)return;const k=ms?1:Math.min(1,(now-t0)/ms),e=1-Math.pow(1-k,3);setFrac(from+(to-from)*e);if(k<1)requestAnimationFrame(step);else done&&done()})(t0);
}
function typeChar(ch){
  const P=S.play;if(!P||P.over||!/[A-Z0-9]/.test(ch))return;
  const w=P.t.word;

}
function legDone(){

}

/* ---- jeux : chaque train en propose un deuxième ---- */
const GAMES={tape:{n:'Tape et roule',ic:'kbd'},memo:{n:'Mémo des trains',ic:'memo'},heure:{n:'Quelle heure ?',ic:'clock'},rail:{n:'Aiguillage',ic:'fork'},speed:{n:'Plus ou moins',ic:'gauge'},cap:{n:'Plus ou moins',ic:'seat'}};
const qtys=t=>[...(t.speed&&!save.solved[t.id+':speed']?['speed']:[]),...(t.cap&&!save.solved[t.id+':cap']?['cap']:[])];
const lastO={}; // dernier jeu proposé par train : jamais deux fois de suite
function randOther(t){
  const p=save.pend[t.id];
  if(p&&lastO[t.id]!==p&&Math.random()<.5)return lastO[t.id]=p;
  const opts=['memo','heure','rail'];if(!p&&(t.speed||t.cap))opts.push('pm');
  const last=lastO[t.id];const i=opts.indexOf(last==='speed'||last==='cap'?'pm':last);if(i>=0)opts.splice(i,1);
  const k=pick1(opts);lastO[t.id]=k;if(k!=='pm')return k;
  const q=qtys(t),kind=pick1(q.length?q:[t.speed&&t.cap?pick1(['speed','cap']):t.speed?'speed':'cap']);
  if(q.length){save.pend[t.id]=kind;persist()}
  return kind;
}
const allOther=t=>['memo','heure','rail',...(t.speed?['speed']:[]),...(t.cap?['cap']:[])];
function otherCard(t,lock,k=S.other||randOther(t)){
  const g=GAMES[k];
  const attr=`data-play="${k}" data-id="${t.id}"`;
  return `<button class="game alt" ${attr} ${lock?'disabled':''}><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${IC[g.ic]}</svg><b>${g.n}</b></button>`;
}
const back=t=>`<a class="back" href="#/train/${t.id}">← ${t.name}</a>`;
const gwrap=inner=>`<article class="th" style="${th(byId(S.gt).t)}">${back(byId(S.gt))}${inner}</article>`;
function unlockPop(nt){
  const o=$('#pop');if(o)o.remove();if(!nt)return;
  document.body.insertAdjacentHTML('beforeend',`<div id="pop" role="dialog" aria-modal="true" aria-label="Nouveau train débloqué"><div class="popc" style="${th(nt.t)}"><div class="eyebrow">Nouveau train débloqué !</div><img src="${photo(nt)}" alt="${nt.name}"><h2>${nt.name}</h2><div class="acts" style="justify-content:center"><button class="btn" data-train="${nt.id}">Voir ${nt.name}</button><button class="btn alt" data-act="pop-close">Continuer</button></div></div></div>`);
  const b=$('#pop .btn');if(b)b.focus();
}
function reward(){const before=unlockedN();save.trips++;persist();const after=unlockedN();return after>before?TRAINS[after-1]:null}
const gend=(msg,ok=true,nt=null)=>(unlockPop(nt),`<div class="end"><h2>${ok?'Bravo !':'Presque !'}</h2><p>${msg}</p>${nt?'':`<p>Tous les trains sont débloqués !</p>`}<div class="acts" style="justify-content:center"><button class="btn" data-act="play-again">Rejouer</button><button class="btn alt" data-train="${nt?nt.id:S.gt}">${nt?'Voir '+nt.name:'Voir le train'}</button></div></div>`);
function startGame(kind,id){
  S.gt=id;S.gk=kind;

  if(kind==='memo')startMemo();else if(kind==='heure')startHeure();else if(kind==='rail')startRail();

function animate(ms,fn,done){
  const t0=performance.now(),id=++anim,still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  (function step(now){if(id!==anim)return;const k=still?1:Math.min(1,(now-t0)/ms);fn(1-Math.pow(1-k,2));if(k<1)requestAnimationFrame(step);else done&&done()})(t0);
}

/* Mémo des trains */
function startMemo(){
  const pool=shuffle(TRAINS).slice(0,6);
  const cards=shuffle(pool.flatMap(t=>[t.id,t.id])).map((id,i)=>({id,i,open:false,done:false}));
  S.g={cards,first:null,lock:false,moves:0,pairs:0,total:6};
}
function memo(){
  const g=S.g;
  const cards=g.cards.map(c=>{const t=byId(c.id),up=c.open||c.done;return `<button class="mc ${up?'up':''} ${c.done?'ok':''}" data-card="${c.i}" aria-label="${up?t.name:'Carte cachée'}">${up?`<img src="${photo(t)}" alt="" style="object-position:${t.pos}"><span>${c.done&&unlocked(t)?t.name:''}</span>`:'<b>?</b>'}</button>`}).join('');
  return gwrap(`<div class="era-tag">Mémo des trains · ${g.moves} ${g.moves>1?'coups':'coup'} · ${g.pairs} sur ${g.total} paires</div><div class="memo">${cards}</div>${g.pairs===g.total?gend(`Tu as trouvé les ${g.total} paires en ${g.moves} coups.`,true,g.nt):''}`);
}
function memoFlip(i){
  const g=S.g,c=g.cards[i];
  if(g.lock||c.open||c.done)return;
  c.open=true;
  if(g.first===null){g.first=i;render(true);return}
  const a=g.cards[g.first];g.moves++;
  if(a.id===c.id){a.done=c.done=true;a.open=c.open=false;g.pairs++;g.first=null;if(g.pairs===g.total&&!g.rewarded){g.rewarded=true;g.nt=reward()}render(true)}
  else{g.lock=true;render(true);setTimeout(()=>{a.open=c.open=false;g.first=null;g.lock=false;if(S.v==='memo'&&S.g===g)render(true)},900)}
}

/* Quelle heure ? */
const fmt=(h,m)=>String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
const pick1=a=>a[Math.floor(Math.random()*a.length)];
function heureQ(r){
  const sets=[[0],[30],[15,45],[0,15,30,45],[5,10,20,25,35,40,50,55]];
  const m=pick1(sets[r]),h=1+Math.floor(Math.random()*12),good=fmt(h,m);
  const wr=[fmt(m/5||12,(h*5)%60),fmt(h%12+1,m),fmt(h,(m+30)%60),fmt(1+Math.floor(Math.random()*12),pick1([0,15,30,45]))].filter((x,i,a)=>x!==good&&a.indexOf(x)===i).slice(0,2);
  return{h,m,good,opts:shuffle([good,...wr])};
}
function startHeure(){S.g={r:0,score:0,phase:'ask',pick:null};S.g.q=heureQ(0)}
function clockSVG(h,m){
  const pt=(deg,len)=>[150+len*Math.sin(deg*Math.PI/180),150-len*Math.cos(deg*Math.PI/180)];
  const hh=pt((h%12)*30+m*.5,62),mm=pt(m*6,96);
  const nums=[...Array(12)].map((_,i)=>{const p=pt((i+1)*30,108);return `<text x="${p[0].toFixed(1)}" y="${(p[1]+9).toFixed(1)}" text-anchor="middle" font-size="26" font-weight="700" fill="#23262B" style="font-family:var(--t-font)">${i+1}</text>`}).join('');
  return `<svg viewBox="0 0 300 300" width="360" height="360" role="img" aria-label="Une horloge"><circle cx="150" cy="150" r="142" fill="#fff" stroke="#23262B" stroke-width="5"/>${nums}<line x1="150" y1="150" x2="${hh[0].toFixed(1)}" y2="${hh[1].toFixed(1)}" stroke="#23262B" stroke-width="10" stroke-linecap="round"/><line x1="150" y1="150" x2="${mm[0].toFixed(1)}" y2="${mm[1].toFixed(1)}" stroke="#C8282D" stroke-width="6" stroke-linecap="round"/><circle cx="150" cy="150" r="9" fill="#C8282D"/></svg>`;
}
function heure(){
  const g=S.g,q=g.q,over=g.phase==='win'||g.phase==='lose';
  if(g.phase==='end')return gwrap(gend(`Score : ${g.score} sur 5.${g.score>=3?'':' Il faut 3 bonnes réponses pour débloquer le train suivant.'}`,g.score>=3,g.nt));
  return gwrap(`<div class="era-tag">Quelle heure ? · Question ${g.r+1} sur 5 · Score ${g.score}</div><div class="tp"><div class="mapcard" style="display:flex;justify-content:center">${clockSVG(q.h,q.m)}</div><div><h1 style="font-size:clamp(30px,4.4vw,52px)">À quelle heure part ce train ?</h1><div class="opts">${q.opts.map(o=>`<button class="opt ${over&&o===q.good?'good':''} ${over&&o===g.pick&&o!==q.good?'bad':''}" data-ans="${o}" data-say="${heureDite(o)}" ${over?'disabled':''}>${o}</button>`).join('')}</div><div class="hint" aria-live="polite">${g.phase==='win'?'Bravo !':g.phase==='lose'?`C'était ${q.good}.`:''}</div>${over?`<div class="acts"><button class="btn" data-act="hnext">${g.r===4?'Voir mon score':'Suivant ▸'}</button></div>`:''}</div></div>`);
}
function heureAns(v){const g=S.g;if(g.phase!=='ask')return;g.pick=v;if(v===g.q.good){g.phase='win';g.score++}else g.phase='lose';render(true)}
function heureNext(){const g=S.g;if(g.r>=4){g.phase='end';if(g.score>=3)g.nt=reward()}else{g.r++;g.q=heureQ(g.r);g.phase='ask';g.pick=null}render()}

/* Aiguillage */
function startRail(){S.g={lv:0,score:0};railLevel()}
function railLevel(){
  const g=S.g,D=g.lv+1,L=1<<D;
  g.D=D;g.names=shuffle(Object.keys(CITY)).slice(0,L);g.sw={};
  for(let d=0;d<D;d++)for(let i=0;i<1<<d;i++)g.sw[d+'-'+i]=Math.floor(Math.random()*2);
  g.target=pick1(g.names);g.att=0;g.phase='set';g.run=false;g.msg='';
}
function railGeo(D){
  const L=1<<D,x0=150,x1=520,pos={},ly=i=>44+(i+.5)*(312/L);
  for(let d=0;d<=D;d++){const n=1<<d,span=L/n;for(let i=0;i<n;i++)pos[d+'-'+i]=[x0+d*(x1-x0)/D,(ly(i*span)+ly(i*span+span-1))/2]}
  return pos;
}
const seg=(a,b)=>`C${(a[0]+b[0])/2},${a[1]} ${(a[0]+b[0])/2},${b[1]} ${b[0]},${b[1]}`;
const RSTART=70;
function railRoute(g){
  const pos=railGeo(g.D),r=pos['0-0'];let i=0,d=`M${RSTART},${r[1]} L${r[0]},${r[1]}`;
  for(let k=0;k<g.D;k++){const c=2*i+g.sw[k+'-'+i];d+=' '+seg(pos[k+'-'+i],pos[(k+1)+'-'+c]);i=c}
  return{d,leaf:i};
}
function railSVG(g,t){
  const pos=railGeo(g.D),acc=line(t),rt=railRoute(g),r0=pos['0-0'];let tr='',sw='',lv='';
  tr+=`<path d="M${RSTART},${r0[1]} L${r0[0]},${r0[1]}" fill="none" stroke="#2A2420" stroke-width="10"/><path d="M${RSTART},${r0[1]} L${r0[0]},${r0[1]}" fill="none" stroke="#EFE9DA" stroke-width="10" stroke-dasharray="2 11"/>`;
  for(let d=0;d<g.D;d++)for(let i=0;i<1<<d;i++){
    const a=pos[d+'-'+i],open=g.sw[d+'-'+i];
    for(let c=0;c<2;c++){const b=pos[(d+1)+'-'+(2*i+c)],p=`M${a[0]},${a[1]} ${seg(a,b)}`;
      tr+=c===open?`<path d="${p}" fill="none" stroke="#2A2420" stroke-width="10"/><path d="${p}" fill="none" stroke="#EFE9DA" stroke-width="10" stroke-dasharray="2 11"/>`:`<path d="${p}" fill="none" stroke="#2A2420" stroke-opacity=".25" stroke-width="5"/>`}
    const b=pos[(d+1)+'-'+(2*i+open)],ang=Math.atan2(b[1]-a[1],b[0]-a[0]);
    sw+=`<g data-sw="${d}-${i}" role="button" tabindex="0" aria-label="Aiguillage : touche pour changer de voie" style="cursor:pointer"><circle cx="${a[0]}" cy="${a[1]}" r="38" fill="transparent"/><circle cx="${a[0]}" cy="${a[1]}" r="25" fill="${acc}" stroke="#fff" stroke-width="5"/><path d="M${a[0]},${a[1]} l${(15*Math.cos(ang)).toFixed(1)},${(15*Math.sin(ang)).toFixed(1)}" stroke="#fff" stroke-width="7" stroke-linecap="round"/></g>`;
  }
  g.names.forEach((n,i)=>{const p=pos[g.D+'-'+i],tg=n===g.target;lv+=`<circle cx="${p[0]}" cy="${p[1]}" r="${tg?13:8}" fill="${tg?acc:'#9aa0a6'}" stroke="#fff" stroke-width="3"/><text x="${p[0]+22}" y="${p[1]+8}" font-size="23" font-weight="700" fill="#23262B" font-family="Lato,sans-serif">${tg?'★ ':''}${n}</text>`});
  return `<svg viewBox="0 0 700 400" role="img" aria-label="Un réseau de voies avec des aiguillages">${tr}<path id="rp" d="${rt.d}" fill="none" stroke="none"/>${lv}${sw}<text x="${RSTART}" y="${r0[1]-44}" text-anchor="middle" font-size="19" font-weight="700" fill="#23262B" font-family="Lato,sans-serif">Départ</text><g id="rt" transform="translate(${RSTART},${r0[1]})"><clipPath id="rc"><circle r="29"/></clipPath><circle r="34" fill="#fff"/><image href="${photo(t)}" x="-42" y="-30" width="84" height="60" preserveAspectRatio="xMidYMid slice" clip-path="url(#rc)"/><circle r="34" fill="none" stroke="${acc}" stroke-width="5"/></g></svg>`;
}
function rail(){
  const g=S.g,t=byId(S.gt);
  if(g.phase==='end')return gwrap(gend(`Score : ${g.score} sur 9.`,true,g.nt));
  const msg=g.phase==='win'?'Bravo, le train est arrivé !':g.phase==='miss'?`Oups, le train est allé à ${g.names[railRoute(g).leaf]}.`:g.msg||'Touche un rond pour changer de voie.';
  const btn=g.phase==='set'?`<button class="btn" data-act="rail-go" ${g.run?'disabled':''}>Départ ▸</button>`:g.phase==='miss'?`<button class="btn" data-act="rail-retry">Réessayer</button>`:`<button class="btn" data-act="rail-next">${g.lv===2?'Voir mon score':'Niveau suivant ▸'}</button>`;
  return gwrap(`<div class="era-tag">Aiguillage · Niveau ${g.lv+1} sur 3 · Score ${g.score}</div><h1 style="font-size:clamp(30px,4.4vw,52px)">Mène le train à ${g.target} !</h1><div class="banner" style="text-align:left;min-height:34px;margin:6px 0 14px" aria-live="polite">${msg}</div><div class="mapcard">${railSVG(g,t)}</div><div class="acts" style="justify-content:center">${btn}</div>`);
}
function railToggle(k){const g=S.g;if(!g||g.run||g.phase!=='set')return;g.sw[k]^=1;render(true)}
function railGo(){
  const g=S.g;if(g.run||g.phase!=='set')return;
  g.run=true;const p=$('#rp'),tok=$('#rt'),L=p.getTotalLength(),leaf=railRoute(g).leaf;
  animate(2400,k=>{const q=p.getPointAtLength(L*k);tok.setAttribute('transform',`translate(${q.x},${q.y})`)},()=>{
    g.run=false;
    if(g.names[leaf]===g.target){g.score+=Math.max(1,3-g.att);g.phase='win'}else{g.phase='miss';g.att++}
    if(S.v==='rail'&&S.g===g)render(true);
  });

function railNext(){const g=S.g;if(g.lv>=2){g.phase='end';g.nt=reward()}else{g.lv++;railLevel()}render()}

/* ---- adresses : chaque écran a son lien (#/train/duplex, #/jeu/memo/duplex ...) ---- */
const go=h=>{if(location.hash===h)applyRoute();else location.hash=h};
function applyRoute(){
  const [a,b,c]=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  S.confirm=false;
  if(a==='epoques')S.v='eras';
  else if(a==='album')S.v='album';
  else if(a==='train'&&byId(b)){S.id=b;S.other=randOther(byId(b));S.v='train'}
  else if(a==='jeu'&&byId(c)){
    const t=byId(c);
    if(!unlocked(t)||!['tape','memo','heure','rail','speed','cap'].includes(b)||(b==='speed'&&!t.speed)||(b==='cap'&&!t.cap)){S.id=c;S.other=randOther(t);S.v='train'}
    else if(b==='tape'){S.pick=c;S.v='journey'}
    else{startGame(b,c);return}
  }else S.v='home';
  render();
}
window.addEventListener('hashchange',applyRoute);
document.addEventListener('click',e=>{
  const sw=e.target.closest('[data-sw]');if(sw){railToggle(sw.dataset.sw);return}
  const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.closest('#pop')){$('#pop').remove();if(b.dataset.act==='pop-close')return}
  const d=b.dataset;
  if(d.ch){const i=$('#typer');if(i)i.focus();typeChar(d.ch);return}
  if(d.yt){ytPlay(b,d.yt);return}
  if(d.ytx){ytClose(b.closest('.yt'));return}
  if(d.card!==undefined){memoFlip(+d.card);return}
  if(d.ans){heureAns(d.ans);return}
  if(d.play){go('#/jeu/'+d.play+'/'+d.id);return}
  if(d.step){setGv(S.sg.gv+Number(d.step));return}
  if(d.go){go(d.go==='home'?'#/':'#/'+(d.go==='eras'?'epoques':d.go))}
  else if(d.train){go('#/train/'+d.train)}
  else if(d.pick){go('#/jeu/tape/'+d.pick)}
  else if(d.chose){S.pick=d.chose;render()}
    
  else if(d.act==='cred'){const p=b.nextElementSibling;p.hidden=!p.hidden;b.setAttribute('aria-expanded',String(!p.hidden))}
  else if(d.act==='again')render()
  else if(d.act==='debug-off'){location.href=location.pathname+location.hash}
  else if(d.act==='hnext')heureNext();
  else if(d.act==='rail-go')railGo();
  else if(d.act==='rail-retry'){S.g.phase='set';render(true)}
  else if(d.act==='rail-next')railNext();
  else if(d.act==='play-again')startGame(S.gk,S.gt);
  else if(d.act==='speedstart')startSpeed();
  else if(d.act==='guess')guess();
  else if(d.act==='next')nextSpeed();
  else if(d.act==='reset'){S.confirm=true;render(true)}
  else if(d.act==='reset-no'){S.confirm=false;render(true)}
  else if(d.act==='reset-yes'){save={seen:[],trips:0,pend:{},solved:{}};persist();S.confirm=false;S.v='album';render()}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.sw){e.preventDefault();railToggle(e.target.dataset.sw);return}
  if(S.v!=='journey'||!S.play||e.ctrlKey||e.metaKey||e.altKey||e.key.length!==1)return;
  const i=$('#typer');if(document.activeElement!==i){e.preventDefault();i.focus();typeChar(e.key.toUpperCase())}
});
applyRoute();
</script>
</body>
</html>
